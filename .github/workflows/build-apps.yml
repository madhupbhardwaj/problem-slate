# Checks the finished apps that the website offers, so a broken download never goes live.
# Runs when downloads/, index.html or this file changes, and on demand from the Actions tab.
name: Check app downloads
on:
  workflow_dispatch:
  push:
    paths:
      - 'downloads/**'
      - 'index.html'
      - '.github/workflows/build-apps.yml'
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Mac app (signature, Apple silicon + Intel, version)
        run: |
          mkdir published && ditto -x -k downloads/problem-slate-macOS-app.zip published
          codesign --verify --deep --strict --verbose=2 published/problem-slate.app
          lipo -info published/problem-slate.app/Contents/MacOS/problem-slate
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' published/problem-slate.app/Contents/Info.plist

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the Windows app linked from the website and run its smoke tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          $url = [regex]::Match((Get-Content index.html -Raw), 'https://github\.com/[^"]+/problem-slate-Windows\.zip').Value
          if (-not $url) { Write-Error 'No Windows download link found in index.html'; exit 1 }
          Write-Host "Checking $url"
          Invoke-WebRequest $url -OutFile problem-slate-Windows.zip
          Expand-Archive problem-slate-Windows.zip -DestinationPath published
          Set-Location published/problem-slate-Windows
          $process = Start-Process ./problem-slate.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(180000)) {
            Write-Host 'Smoke tests timed out. Progress:'; Get-Content smoke-test-progress.txt -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force; exit 1
          }
          Get-Content smoke-test-result.txt
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
